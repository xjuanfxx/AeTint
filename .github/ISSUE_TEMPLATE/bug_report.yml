name: Bug report
description: Something looks wrong or doesn't work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Screenshots or a short video help a lot.
  - type: input
    id: aetint
    attributes:
      label: AeTint version
      description: Shown next to the logo, e.g. v0.3.0
    validations:
      required: true
  - type: input
    id: ae
    attributes:
      label: After Effects version
      description: Help → About After Effects, e.g. 26.5
    validations:
      required: true
  - type: dropdown
    id: brightness
    attributes:
      label: AE brightness
      options: [Darkest, Dark, Light]
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options: [Panels, Timeline, Home screen, Menus / context menus, Title bar, AeTint window, Installer / updates, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or video
      description: Drag files here.
