name: Feature request
description: An idea or something you'd like AeTint to do
labels: ["feature"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Screenshots, mock-ups or links (optional).
