[workspace]
members = [".", "crates/menuhook", "crates/menutest", "crates/loader", "crates/setup"]

[package]
name = "aetint"
version = "0.2.5"
edition = "2021"
rust-version = "1.88"
description = "AeTint — temas completos para After Effects (paneles, timeline y menús)"
# GPL-3.0: la misma licencia con la que se usa Slint (la interfaz).
license = "GPL-3.0-only"
autobins = false

[[bin]]
name = "AeTint"
path = "src/main.rs"

[dependencies]
slint = { version = "1.16", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: al reescribir los JSON de Adobe las claves quedan en el mismo orden.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# comprobación de actualizaciones (última Release de GitHub)
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Media_Audio"] }

[build-dependencies]
slint-build = "1.16"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
