[package]
name = "aetint_loader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "AeTint: plugin de After Effects (.aex) que carga aetint_menu.dll al arrancar AE"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }

[build-dependencies]
winresource = "0.1"
